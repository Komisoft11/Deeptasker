variables:
  IMAGE_BASE: $CI_REGISTRY_IMAGE/event-stream

stages:
  - build

build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --pull -t $IMAGE_BASE:$CI_COMMIT_TAG -t $IMAGE_BASE:latest .
    - docker push $IMAGE_BASE:$CI_COMMIT_TAG
    - docker push $IMAGE_BASE:latest
  rules:
    - if: $CI_COMMIT_TAG